[project]
name = "log-analyzer"
version = "0.1.0"
description = "CLI tool for parsing and analyzing WMS application logs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
log-analyzer = "analyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analyzer*"]